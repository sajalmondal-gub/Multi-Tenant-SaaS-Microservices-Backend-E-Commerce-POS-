version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    command: npm run dev --workspace=apps/api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - redis

  order-service:
    build:
      context: .
      args:
        SERVICE_NAME: order-service
    container_name: order-service
    command: npm run dev --workspace=apps/order-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/order_db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

  product-service:
    build:
      context: .
      args:
        SERVICE_NAME: product-service
    container_name: product-service
    command: npm run dev --workspace=apps/product-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/product_db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

  purchase-service:
    build:
      context: .
      args:
        SERVICE_NAME: purchase-service
    container_name: purchase-service
    command: npm run dev --workspace=apps/purchase-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/purchase_db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

  stock-management-service:
    build:
      context: .
      args:
        SERVICE_NAME: stock-management-service
    container_name: stock-management-service
    command: npm run dev --workspace=apps/stock-management-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/stock_db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

  tenant-service:
    build:
      context: .
      args:
        SERVICE_NAME: tenant-service
    container_name: tenant-service
    command: npm run dev --workspace=apps/tenant-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/tenant_db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

  theme-service:
    build:
      context: .
      args:
        SERVICE_NAME: theme-service
    container_name: theme-service
    command: npm run dev --workspace=apps/theme-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/theme_db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
