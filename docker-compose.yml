version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    command: npm run dev --workspace=apps/api-gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      - PORT=${API_GATEWAY_PORT}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - redis

  order-service:
    build:
      context: .
      args:
        SERVICE_NAME: order-service
    container_name: order-service
    command: npm run dev --workspace=apps/order-service
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    environment:
      - PORT=${ORDER_SERVICE_PORT}
      - DATABASE_URL=${ORDER_SERVICE_DB_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

  product-service:
    build:
      context: .
      args:
        SERVICE_NAME: product-service
    container_name: product-service
    command: npm run dev --workspace=apps/product-service
    ports:
      - "${PRODUCT_SERVICE_PORT}:${PRODUCT_SERVICE_PORT}"
    environment:
      - PORT=${PRODUCT_SERVICE_PORT}
      - DATABASE_URL=${PRODUCT_SERVICE_DB_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

  purchase-service:
    build:
      context: .
      args:
        SERVICE_NAME: purchase-service
    container_name: purchase-service
    command: npm run dev --workspace=apps/purchase-service
    ports:
      - "${PURCHASE_SERVICE_PORT}:${PURCHASE_SERVICE_PORT}"
    environment:
      - PORT=${PURCHASE_SERVICE_PORT}
      - DATABASE_URL=${PURCHASE_SERVICE_DB_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

  stock-management-service:
    build:
      context: .
      args:
        SERVICE_NAME: stock-management-service
    container_name: stock-management-service
    command: npm run dev --workspace=apps/stock-management-service
    ports:
      - "${STOCK_MANAGEMENT_SERVICE_PORT}:${STOCK_MANAGEMENT_SERVICE_PORT}"
    environment:
      - PORT=${STOCK_MANAGEMENT_SERVICE_PORT}
      - DATABASE_URL=${STOCK_MANAGEMENT_SERVICE_DB_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

  tenant-service:
    build:
      context: .
      args:
        SERVICE_NAME: tenant-service
    container_name: tenant-service
    command: npm run dev --workspace=apps/tenant-service
    ports:
      - "${TENANT_SERVICE_PORT}:${TENANT_SERVICE_PORT}"
    environment:
      - PORT=${TENANT_SERVICE_PORT}
      - DATABASE_URL=${TENANT_SERVICE_DB_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

  theme-service:
    build:
      context: .
      args:
        SERVICE_NAME: theme-service
    container_name: theme-service
    command: npm run dev --workspace=apps/theme-service
    ports:
      - "${THEME_SERVICE_PORT}:${THEME_SERVICE_PORT}"
    environment:
      - PORT=${THEME_SERVICE_PORT}
      - DATABASE_URL=${THEME_SERVICE_DB_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
